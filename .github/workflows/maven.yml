name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Compiles the project structure without triggering the tests prematurely
      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      # Triggers your structured TestNG XML suite runner in cloud headless mode
      - name: Run TestNG Automation Tests
        run: mvn -B test -DsuiteXmlFile=src/test/resources/testng.xml -Dsurefire.suiteXmlFiles=src/test/resources/testng.xml -Dheadless=true

      # Collects execution reports and ExtentReport even if assertions or test cases fail
      - name: Archive Test Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-automation-reports
          path: |
            target/ExtentReport.html
            target/surefire-reports/
            test-output/
          if-no-files-found: warn

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6