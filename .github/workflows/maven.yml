name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'reports/**'
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'Select Platform to Run'
        required: true
        default: 'api'
        type: choice
        options:
          - api
          - web
          - mobile
          - all

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Run TestNG Automation Tests
        env:
          SELECTED_PLATFORM: ${{ github.event.inputs.platform || 'api' }}
        run: |
          if [ "$SELECTED_PLATFORM" = "all" ]; then
            mvn -B test -Dplatform=web -Dheadless=true
          else
            mvn -B test -Dplatform=$SELECTED_PLATFORM -Dgroups=$SELECTED_PLATFORM -Dheadless=true
          fi

      - name: Commit ExtentReport to Branch
        if: always() && github.event_name == 'push'
        run: |
          if [ -f target/ExtentReport.html ]; then
            mkdir -p reports
            cp target/ExtentReport.html reports/ExtentReport.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f reports/ExtentReport.html
            if ! git diff --cached --quiet; then
              git commit -m "chore: update ExtentReport for ${GITHUB_REF_NAME} [skip ci]"
              git pull --rebase origin "${GITHUB_REF_NAME}" || true
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi

      - name: Archive Test Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-automation-reports-${{ github.run_id }}
          path: |
            target/ExtentReport.html
            target/surefire-reports/
            test-output/
          if-no-files-found: warn

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
