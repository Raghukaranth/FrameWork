name: Java CI with Maven

on:
  push:
    branches: [ "**" ]
    paths-ignore:
      - 'reports/**'
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      - name: Run TestNG Automation Tests
        run: mvn -B test -DsuiteXmlFile=src/test/resources/testng.xml -Dsurefire.suiteXmlFiles=src/test/resources/testng.xml -Dheadless=true

      - name: Commit ExtentReport to Branch
        if: always()
        run: |
          if [ -f target/ExtentReport.html ]; then
            mkdir -p reports
            cp target/ExtentReport.html reports/ExtentReport.html
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f reports/ExtentReport.html
            git commit -m "chore: update ExtentReport for ${GITHUB_REF_NAME} [skip ci]" || true
            git push origin HEAD:${GITHUB_REF_NAME}
          fi

      - name: Archive Test Reports Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-automation-reports
          path: |
            target/ExtentReport.html
            target/surefire-reports/
            test-output/
          if-no-files-found: warn

      - name: Update dependency graph
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6